<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="460" viewBox="0 0 1440 460" fill="none" role="img" aria-labelledby="title description">
  <title id="title">Gentle writing app</title>
  <desc id="description">A warm lavender banner with the Gentle wordmark and a preview of its writing editor.</desc>
  <defs>
